<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strudel Cycle</title>
<script src="https://unpkg.com/@strudel/web@1.0.3"></script>
<style>
  :root {
    --bg: #14151a; --panel: #1d1f27; --line: #33364a; --text: #e8e8ef;
    --muted: #8a8da3; --accent: #f5b942; --active: #4fd1a5; --off: #2a2c38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, sans-serif;
    display: flex; justify-content: center; padding: 40px 16px;
  }
  main { width: 100%; max-width: 820px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  /* timeline */
  .timeline { position: relative; background: var(--panel); border-radius: 10px; padding: 16px 0 0; }
  .ticks { position: relative; height: 20px; margin: 0 16px; }
  .tick { position: absolute; transform: translateX(-50%); font-size: 12px; color: var(--muted); }
  .tick.second { color: var(--text); font-weight: 600; }
  .track { position: relative; display: grid; margin: 0 16px 16px; height: 150px; }
  .slot { border-left: 1px solid var(--line); display: grid; padding: 8px 4px; gap: 4px; }
  .slot:first-child { border-left: none; }
  .slot.on-second { border-left: 2px solid var(--muted); }
  .sub-slot {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border-radius: 8px; transition: background .08s; padding: 4px 2px;
  }
  .sub-slot.active { background: color-mix(in srgb, var(--active) 22%, transparent); }
  .sub-slot .label { font-size: 22px; font-weight: 700; }
  .sub-slot.off .label { color: var(--muted); }
  .sub-slot select {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 4px; font: inherit; font-size: 13px; max-width: 100%;
  }
  .sub-slot.off select { opacity: .5; }
  .toggle {
    width: 100%; max-width: 64px; padding: 4px 0; border-radius: 6px; border: 1px solid var(--line);
    background: var(--off); color: var(--muted); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .toggle.on { background: var(--active); color: #111; border-color: var(--active); }
  .playhead {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent);
    box-shadow: 0 0 8px var(--accent); left: 0; display: none; pointer-events: none;
  }

  /* controls */
  .controls { display: flex; gap: 12px; align-items: center; margin: 20px 0; }
  .play {
    background: var(--accent); color: #111; border: none; border-radius: 8px;
    padding: 10px 22px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .play:disabled { opacity: .5; cursor: wait; }
  .status { color: var(--muted); font-size: 13px; }
  .cycle-count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

  pre {
    background: var(--panel); border-radius: 10px; padding: 14px 16px; margin: 0;
    font: 14px/1.5 ui-monospace, Consolas, monospace; color: var(--active); overflow-x: auto;
  }
  .code-label { color: var(--muted); font-size: 12px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .05em; }

  .examples { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .example {
    width: 100%; display: flex; gap: 14px; align-items: baseline; text-align: left;
    background: var(--panel); color: var(--text); border: 1px solid transparent; border-radius: 8px;
    padding: 8px 12px; font: inherit; cursor: pointer;
  }
  .example:hover { border-color: var(--line); }
  .example .name { min-width: 130px; font-weight: 600; }
  .example code { font: 13px ui-monospace, Consolas, monospace; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Strudel Cycle</h1>
  <p class="sub">One Strudel cycle = 2 seconds. Each step holds two slots: the ON slots share the step evenly. Pick "rest" in a slot to shorten the other note.</p>

  <div class="timeline">
    <div class="ticks" id="ticks"></div>
    <div class="track" id="track">
      <div class="playhead" id="playhead"></div>
    </div>
  </div>

  <div class="controls">
    <button class="play" id="play" disabled>Loading…</button>
    <span class="status" id="status"></span>
    <span class="cycle-count" id="cycleCount"></span>
  </div>

  <p class="code-label">Strudel code being played</p>
  <pre id="code"></pre>

  <p class="code-label" style="margin-top:24px">Examples (click to load)</p>
  <ul class="examples" id="examples"></ul>
</main>

<script>
// ---- Settings: change these to grow the grid later ----
const CYCLE_SECONDS = 2;      // Strudel's default: 0.5 cycles per second, so 1 cycle = 2 s
const STEPS_PER_SECOND = 2;   // 2 steps per second -> 4 steps per cycle
const NOTES_PER_STEP = 2;     // each step is split evenly into this many note slots
const STEPS = CYCLE_SECONDS * STEPS_PER_SECOND;
const SOUND = 'triangle';     // built-in synth, so no samples need to download
// The Strudel scheduler plays audio a bit after you press play. This keeps the playhead in step with it.
const SCHEDULER_LATENCY = 0.1;

const NOTE_CHOICES = ['~'];   // '~' is a rest: pick it to make the other note in the step shorter
for (const oct of [3, 4, 5]) {
  for (const n of ['c', 'd', 'e', 'f', 'g', 'a', 'b']) NOTE_CHOICES.push(n + oct);
}

// Starting melody: steps[i][j] = { pitch, on }. Second note of each step starts off.
const startPitches = ['c4', 'e4', 'g4', 'c5'];
const steps = Array.from({ length: STEPS }, (_, i) =>
  Array.from({ length: NOTES_PER_STEP }, (_, j) => ({
    pitch: startPitches[(i + j) % startPitches.length],
    on: j === 0,
  }))
);

// ---- Build the UI ----
const track = document.getElementById('track');
const ticks = document.getElementById('ticks');
const playhead = document.getElementById('playhead');
track.style.gridTemplateColumns = `repeat(${STEPS}, 1fr)`;

for (let i = 0; i <= STEPS; i++) {
  const t = i / STEPS_PER_SECOND;
  const el = document.createElement('span');
  el.className = 'tick' + (Number.isInteger(t) ? ' second' : '');
  el.style.left = (i / STEPS * 100) + '%';
  el.textContent = t + 's';
  ticks.appendChild(el);
}

// subSlotEls[i][j] -> { el, label, toggle }
const subSlotEls = steps.map((notes, i) => {
  const slot = document.createElement('div');
  slot.className = 'slot' + (i > 0 && i % STEPS_PER_SECOND === 0 ? ' on-second' : '');
  slot.style.gridTemplateColumns = `repeat(${NOTES_PER_STEP}, 1fr)`;
  track.appendChild(slot);

  return notes.map((n, j) => {
    const el = document.createElement('div');
    el.className = 'sub-slot';
    const label = document.createElement('div');
    label.className = 'label';

    const select = document.createElement('select');
    for (const p of NOTE_CHOICES) {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p === '~' ? 'rest' : p.toUpperCase();
      select.appendChild(opt);
    }
    select.value = n.pitch;
    select.addEventListener('change', () => { n.pitch = select.value; update(); });

    const toggle = document.createElement('button');
    toggle.className = 'toggle';
    toggle.addEventListener('click', () => { n.on = !n.on; update(); });

    el.append(label, select, toggle);
    slot.appendChild(el);
    return { el, label, toggle, select };
  });
});

// Only ON notes count. One note fills the whole step; several share it evenly in a
// bracketed group. "~" is a rest in Strudel mini-notation.
function patternString() {
  return steps.map(notes => {
    const parts = notes.filter(n => n.on).map(n => n.pitch);
    if (parts.length === 0) return '~';
    if (parts.length === 1) return parts[0];
    return `[${parts.join(' ')}]`;
  }).join(' ');
}

function patternCode() {
  return `note("${patternString()}").s("${SOUND}")`;
}

function render() {
  steps.forEach((notes, i) => notes.forEach((n, j) => {
    const { el, label, toggle, select } = subSlotEls[i][j];
    select.value = n.pitch;
    label.textContent = n.pitch === '~' ? '–' : n.pitch.toUpperCase();
    el.classList.toggle('off', !n.on);
    toggle.classList.toggle('on', n.on);
    toggle.textContent = n.on ? 'ON' : 'OFF';
  }));
  document.getElementById('code').textContent = patternCode();
}

function update() {
  render();
  if (playing) playPattern();   // swap in the new pattern without restarting the cycle
}

// ---- Example patterns ----
// Each example is one entry per step: "c4" (one slot on), "[c4 e4]" (both on), "~" (both off).
const EXAMPLES = [
  { name: 'Arpeggio up',     steps: ['c4', 'e4', 'g4', 'c5'] },
  { name: 'Walk down',       steps: ['c5', 'b4', 'a4', 'g4'] },
  { name: 'Staccato',        steps: ['[c4 ~]', '[e4 ~]', '[g4 ~]', '[c5 ~]'] },
  { name: 'Sparse',          steps: ['c4', '~', 'g4', '~'] },
  { name: 'Gallop',          steps: ['[c4 c4]', 'e4', '[g4 g4]', 'e4'] },
  { name: 'Pedal tone',      steps: ['[c4 c5]', '[e4 c5]', '[g4 c5]', '[e4 c5]'] },
  { name: 'Octave bounce',   steps: ['[c3 c4]', '[c3 c4]', '[g3 g4]', '[g3 g4]'] },
  { name: 'Pentatonic run',  steps: ['[c4 d4]', '[e4 g4]', '[a4 c5]', '[d5 e5]'] },
  { name: 'Call and answer', steps: ['c4', 'e4', 'g4', '[f4 d4]'] },
  { name: 'Minor turn',      steps: ['a3', 'c4', 'e4', '[a4 g4]'] },
];

function loadExample(ex) {
  ex.steps.forEach((entry, i) => {
    const pitches = entry.replace(/[\[\]]/g, '').split(' ').filter(p => p !== '' && entry !== '~');
    steps[i].forEach((n, j) => {
      n.on = j < pitches.length;
      if (n.on) n.pitch = pitches[j];
    });
  });
  update();
}

const list = document.getElementById('examples');
for (const ex of EXAMPLES) {
  const li = document.createElement('li');
  const btn = document.createElement('button');
  btn.className = 'example';
  btn.innerHTML = `<span class="name">${ex.name}</span><code>${ex.steps.join(' ')}</code>`;
  btn.addEventListener('click', () => loadExample(ex));
  li.appendChild(btn);
  list.appendChild(li);
}
render();

// ---- Strudel ----
let playing = false;
let startTime = 0;   // audio-clock time when cycle 0 begins
const playBtn = document.getElementById('play');
const cycleCountEl = document.getElementById('cycleCount');

initStrudel();

// initStrudel loads in the background; wait until its functions exist globally.
(function waitForStrudel() {
  if (typeof note === 'function' && typeof getAudioContext === 'function') {
    playBtn.disabled = false;
    playBtn.textContent = 'Play';
  } else {
    setTimeout(waitForStrudel, 50);
  }
})();

function playPattern() {
  // Same pattern as the code shown on the page, built with Strudel's functions
  note(patternString()).s(SOUND).play();
}

playBtn.addEventListener('click', async () => {
  const ctx = getAudioContext();
  if (ctx.state !== 'running') await ctx.resume();
  if (!playing) {
    startTime = ctx.currentTime + SCHEDULER_LATENCY;
    playPattern();
    playing = true;
    playBtn.textContent = 'Stop';
    playhead.style.display = 'block';
    requestAnimationFrame(tick);
  } else {
    hush();
    playing = false;
    playBtn.textContent = 'Play';
    playhead.style.display = 'none';
    subSlotEls.flat().forEach(s => s.el.classList.remove('active'));
    cycleCountEl.textContent = '';
  }
});

function tick() {
  if (!playing) return;
  const elapsed = Math.max(0, getAudioContext().currentTime - startTime);
  const cycle = elapsed / CYCLE_SECONDS;        // e.g. 3.25 = a quarter of the way into the 4th cycle
  const phase = cycle % 1;                      // 0..1 position within the current 2 s cycle
  playhead.style.left = (phase * 100) + '%';
  // Highlight the slot that is sounding: ON slots share the step evenly, OFF slots are skipped.
  const stepIdx = Math.floor(phase * STEPS);
  const stepPhase = phase * STEPS - stepIdx;        // 0..1 within the current step
  const onIdx = steps[stepIdx].map((n, j) => (n.on ? j : -1)).filter(j => j >= 0);
  const activeJ = onIdx.length ? onIdx[Math.floor(stepPhase * onIdx.length)] : -1;
  subSlotEls.forEach((row, i) => row.forEach((s, j) =>
    s.el.classList.toggle('active', i === stepIdx && j === activeJ)));
  cycleCountEl.textContent = `cycle ${Math.floor(cycle) + 1} · ${(phase * CYCLE_SECONDS).toFixed(2)}s`;
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
